name: soa-lab3

networks:
  internal:

volumes:
  nats-data:
  pg-data:
  minio-data:

services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes: [nats-data:/data]
    ports: ["8222:8222"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: detection
      POSTGRES_USER: ${POSTGRES_USER:-detection}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-detection}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d detection"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes: [minio-data:/data]
    ports: ["9001:9001"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r l <&3; [[ $$l == *200* ]]"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: cgr.dev/chainguard/minio-client
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin123}@minio:9000
    command: ["mb", "-p", "local/models"]
    networks: [internal]
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    volumes: ["./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8000:80"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-observability:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: {MODULE: mock-observability}
    environment:
      MOCK_NODES: ${MOCK_NODES:-node-1,node-2,node-3}
    ports: ["8090:8080"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  node-registry:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: {MODULE: node-registry}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/detection
      DB_USER: ${POSTGRES_USER:-detection}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-detection}
      NATS_URL: nats://nats:4222
      PROMETHEUS_URL: http://mock-observability:8080
    depends_on:
      nats: {condition: service_healthy}
      postgres: {condition: service_healthy}
      mock-observability: {condition: service_healthy}
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
