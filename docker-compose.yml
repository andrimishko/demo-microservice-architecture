name: soa-lab3

# restart: unless-stopped respects a manual `docker compose stop` (the demos rely on it) and
# does not bring the stack back after a Docker restart if it was stopped; logs capped at 3x10 MB.
x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

networks:
  internal:

volumes:
  nats-data:
  pg-data:
  minio-data:

services:
  nats:
    <<: *service-defaults
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes: [nats-data:/data]
    ports: ["8222:8222"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    <<: *service-defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: detection
      POSTGRES_USER: ${POSTGRES_USER:-detection}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-detection}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d detection"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    <<: *service-defaults
    image: cgr.dev/chainguard/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes: [minio-data:/data]
    ports: ["9001:9001"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r l <&3; [[ $$l == *200* ]]"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: cgr.dev/chainguard/minio-client
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin123}@minio:9000
    command: ["mb", "-p", "local/models"]
    networks: [internal]
    restart: "no"

  nginx:
    <<: *service-defaults
    image: nginx:1.27-alpine   # 1.27.5: upstream `resolve` needs >= 1.27.3
    volumes:
      - ./infra/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./contracts:/usr/share/nginx/contracts:ro
    environment:
      NGINX_ENVSUBST_FILTER: API_KEY
      ADMIN_API_KEY: ${ADMIN_API_KEY:-admin-demo-key}
      ENGINEER_API_KEY: ${ENGINEER_API_KEY:-engineer-demo-key}
    # service_started only: `resolve` lets nginx start while a backend is down
    depends_on:
      node-registry: {condition: service_started}
      fuzzy-inference: {condition: service_started}
      operator-feedback: {condition: service_started}
      anomaly-assessment: {condition: service_started}
    ports: ["8000:80"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  swagger-ui:
    <<: *service-defaults
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      BASE_URL: /docs
      PERSIST_AUTHORIZATION: "true"
      URLS_PRIMARY_NAME: "S5 operator-feedback"
      URLS: >-
        [{"url":"/docs/specs/openapi/node-registry.yaml","name":"S1 node-registry"},
        {"url":"/docs/specs/openapi/fuzzy-inference.yaml","name":"S3 fuzzy-inference"},
        {"url":"/docs/specs/openapi/anomaly-assessment.yaml","name":"S4 anomaly-assessment"},
        {"url":"/docs/specs/openapi/operator-feedback.yaml","name":"S5 operator-feedback"}]
    networks: [internal]
    healthcheck:   # demo/lib.sh waits until every service is healthy
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/docs/"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-observability:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: {MODULE: mock-observability}
    environment:
      MOCK_NODES: ${MOCK_NODES:-node-1,node-2,node-3}
    ports: ["8090:8080"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  node-registry:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: {MODULE: node-registry}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/detection
      DB_USER: ${POSTGRES_USER:-detection}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-detection}
      NATS_URL: nats://nats:4222
      PROMETHEUS_URL: http://mock-observability:8080
    depends_on:
      nats: {condition: service_healthy}
      postgres: {condition: service_healthy}
      mock-observability: {condition: service_healthy}
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  feature-aggregator-0:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: {MODULE: feature-aggregator}
    environment: &aggregator-env
      SHARD_INDEX: 0
      SHARD_COUNT: 1
      WINDOW_SECONDS: 10
      NATS_URL: nats://nats:4222
      REGISTRY_URL: http://node-registry:8080
      PROMETHEUS_URL: http://mock-observability:8080
      OPENSEARCH_URL: http://mock-observability:8080
    depends_on:
      nats: {condition: service_healthy}
      node-registry: {condition: service_healthy}
      mock-observability: {condition: service_healthy}
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  fuzzy-inference:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: {MODULE: fuzzy-inference}
    environment: &fuzzy-env
      SPRING_PROFILES_ACTIVE: inference
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    depends_on: &fuzzy-depends
      nats: {condition: service_healthy}
      minio: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    networks: [internal]
    healthcheck: &fuzzy-health
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # exactly one replica: the single writer of new model versions
  fuzzy-adaptation:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: {MODULE: fuzzy-inference}
    environment:
      <<: *fuzzy-env
      SPRING_PROFILES_ACTIVE: adaptation
    depends_on: *fuzzy-depends
    networks: [internal]
    healthcheck: *fuzzy-health

  anomaly-assessment:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: {MODULE: anomaly-assessment}
    environment:
      NATS_URL: nats://nats:4222
      REGISTRY_URL: http://node-registry:8080
      OPENSEARCH_URL: http://mock-observability:8080
      ALERTMANAGER_URL: http://mock-observability:8080
      ESCALATION_AFTER: ${ESCALATION_AFTER:-30s}
    depends_on:
      nats: {condition: service_healthy}
      node-registry: {condition: service_healthy}
      mock-observability: {condition: service_healthy}
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  operator-feedback:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: {MODULE: operator-feedback}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/detection
      DB_USER: ${POSTGRES_USER:-detection}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-detection}
      NATS_URL: nats://nats:4222
    depends_on:
      nats: {condition: service_healthy}
      postgres: {condition: service_healthy}
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Second shard: set SHARD_COUNT=2 in BOTH replicas (and restart the first), then add
  #
  # feature-aggregator-1:
  #   build:
  #     context: .
  #     dockerfile: docker/service.Dockerfile
  #     args: {MODULE: feature-aggregator}
  #   environment:
  #     <<: *aggregator-env
  #     SHARD_INDEX: 1
  #     SHARD_COUNT: 2
  #   depends_on: <same as feature-aggregator-0>
  #   networks: [internal]
  #   healthcheck: <same as feature-aggregator-0>
